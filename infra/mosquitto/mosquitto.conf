# Broker MQTT do EnergIA Sense.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/
# Guarda mensagens QoS 1 da sessão persistente da ingestão enquanto ela reinicia.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
