; Firmware do nó sensor EnergIA Sense (ESP32 + PZEM-004T v3 + SCT-013).
; Antes de compilar: cp include/config.exemplo.h include/config.h e preencha.

[platformio]
default_envs = no

[comum]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

[env:no]
extends = comum
build_src_filter = +<*.cpp> -<ferramentas/>

; Grava o endereço Modbus de um PZEM por vez (ligue só um no barramento).
[env:enderecar]
extends = comum
build_src_filter = +<ferramentas/enderecar.cpp>
